<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-label="terminal demo. whoami: AI Agent · Infrastructure Engineer. airlens observe 30d: 66,307 requests, 55 countries (requests, not users), 10 data sources, 5 ML engines, 35 edge functions. agent enforce: 3 runtimes, 17 hooks, 296 high-risk ops blocked, 0 false positives. gitleaks: 1,402 commits scanned, 0 leaks">
  <defs>
    <style>
      .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:13px}
      .line{opacity:0;animation:lineFade 13s ease-in-out infinite}
      @keyframes lineFade{0%{opacity:0}3%{opacity:1}86%{opacity:1}92%{opacity:0}100%{opacity:0}}
      .l0{animation-delay:0s}.l1{animation-delay:.5s}.l2{animation-delay:1s}.l3{animation-delay:1.5s}
      .l4{animation-delay:2s}.l5{animation-delay:2.5s}.l6{animation-delay:3s}.l7{animation-delay:3.5s}
      .l8{animation-delay:4s}.l9{animation-delay:4.5s}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}.line{opacity:1}}
    </style>
  </defs>
  <rect width="860" height="360" rx="12" fill="#0A0C10" stroke="#232936"/>
  <rect x="1" y="1" width="858" height="34" rx="11" fill="#12151C"/>
  <rect x="1" y="24" width="858" height="12" fill="#12151C"/>
  <circle cx="24" cy="18" r="5.5" fill="#FF6B4A"/>
  <circle cx="44" cy="18" r="5.5" fill="#D7FF3F"/>
  <circle cx="64" cy="18" r="5.5" fill="#43D9AD"/>
  <text x="430" y="22" class="mono" font-size="11" fill="#7E8798" text-anchor="middle">observatory — zsh</text>
  <g class="mono">
    <g class="line l0">
      <text x="24" y="64" fill="#43D9AD">$ <tspan fill="#EDEFF4">whoami</tspan></text>
    </g>
    <g class="line l1">
      <text x="24" y="88" fill="#8A93A6">AI Agent · Infrastructure Engineer — 조용민 Yongmin Cho</text>
    </g>
    <g class="line l2">
      <text x="24" y="122" fill="#43D9AD">$ <tspan fill="#EDEFF4">airlens observe --window 30d</tspan></text>
    </g>
    <g class="line l3">
      <text x="24" y="146" fill="#8A93A6">▸ <tspan fill="#D7FF3F">66,307</tspan> requests · <tspan fill="#EDEFF4">55</tspan> countries <tspan fill="#7E8798">(requests, not users)</tspan></text>
    </g>
    <g class="line l4">
      <text x="24" y="170" fill="#8A93A6">▸ <tspan fill="#EDEFF4">10</tspan> data sources · <tspan fill="#EDEFF4">5</tspan> ML engines · <tspan fill="#EDEFF4">35</tspan> edge functions · <tspan fill="#EDEFF4">121</tspan> migrations</text>
    </g>
    <g class="line l5">
      <text x="24" y="204" fill="#43D9AD">$ <tspan fill="#EDEFF4">agent enforce --runtime all</tspan></text>
    </g>
    <g class="line l6">
      <text x="24" y="228" fill="#8A93A6">▸ <tspan fill="#EDEFF4">3</tspan> runtimes · <tspan fill="#EDEFF4">17</tspan> hooks · <tspan fill="#FF6B4A">296</tspan> high-risk ops blocked · <tspan fill="#43D9AD">0</tspan> false positives</text>
    </g>
    <g class="line l7">
      <text x="24" y="252" fill="#8A93A6">▸ blind benchmark <tspan fill="#43D9AD">8/8</tspan> bugs detected · audit log <tspan fill="#EDEFF4">18,000+</tspan> lines</text>
    </g>
    <g class="line l8">
      <text x="24" y="286" fill="#43D9AD">$ <tspan fill="#EDEFF4">gitleaks detect --full-history</tspan></text>
    </g>
    <g class="line l8">
      <text x="24" y="310" fill="#8A93A6">▸ 1,402 commits scanned · <tspan fill="#43D9AD">0 leaks</tspan></text>
    </g>
    <g class="line l9">
      <text x="24" y="340" fill="#43D9AD">$</text>
      <rect x="40" y="329" width="8" height="14" fill="#D7FF3F">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
