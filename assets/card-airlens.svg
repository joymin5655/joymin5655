<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 210" role="img" aria-label="AirLens — 대기질 인텔리전스 SaaS · AI 에이전트 협업 · 1인 책임·운영 · LIVE. 55개국 · 66,307 요청/30일(사용자 아님) · 10 데이터 소스 · 5 ML 엔진 · GPT-4o 에이전트">
  <defs>
    <style>
      .sans{font-family:-apple-system,'Segoe UI','Pretendard',sans-serif}
      .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
    <filter id="glowAL" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="430" height="210" rx="12" fill="#0A0C10" stroke="#232936"/>
  <circle cx="402" cy="36" r="66" fill="#25E2F4" opacity="0.05" filter="url(#glowAL)">
    <animate attributeName="opacity" values="0.03;0.11;0.03" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="4.5" fill="#25E2F4" filter="url(#glowAL)" opacity="0.85">
    <animateMotion dur="9s" repeatCount="indefinite" path="M12,1 H418 A11,11 0 0 1 429,12 V198 A11,11 0 0 1 418,209 H12 A11,11 0 0 1 1,198 V12 A11,11 0 0 1 12,1 Z"/>
  </circle>
  <g class="mono">
    <circle cx="26" cy="30" r="3.5" fill="#43D9AD">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="34" font-size="10" fill="#43D9AD" letter-spacing="1">LIVE</text>
    <text x="406" y="34" font-size="9" fill="#7E8798" text-anchor="end" letter-spacing="1">FLAGSHIP</text>
  </g>
  <text x="24" y="70" class="sans" font-size="26" font-weight="800" fill="#EDEFF4">AirLens</text>
  <text x="24" y="90" class="mono" font-size="10" fill="#9DBD2A" letter-spacing="1">대기질 인텔리전스 SAAS · AI 에이전트 협업 · 1인 운영</text>
  <g class="mono" font-size="12">
    <text x="24" y="120" fill="#D7FF3F">66,307 <tspan fill="#7E8798" font-size="10">req/30d*</tspan>  <tspan fill="#EDEFF4">55</tspan> <tspan fill="#7E8798" font-size="10">countries</tspan>  <tspan fill="#EDEFF4">10</tspan> <tspan fill="#7E8798" font-size="10">sources</tspan>  <tspan fill="#EDEFF4">5</tspan> <tspan fill="#7E8798" font-size="10">ML</tspan></text>
    <text x="24" y="140" fill="#8A93A6" font-size="10">GPT-4o 에이전트 · SDID 인과추론 · pgvector RAG · ONNX 엣지</text>
    <text x="24" y="156" fill="#7E8798" font-size="8">* requests, not users</text>
  </g>
  <g class="mono" font-size="9">
    <rect x="24" y="170" width="52" height="18" rx="9" fill="none" stroke="#232936"/>
    <text x="50" y="182" fill="#8A93A6" text-anchor="middle">GPT-4o</text>
    <rect x="82" y="170" width="58" height="18" rx="9" fill="none" stroke="#232936"/>
    <text x="111" y="182" fill="#8A93A6" text-anchor="middle">FastAPI</text>
    <rect x="146" y="170" width="66" height="18" rx="9" fill="none" stroke="#232936"/>
    <text x="179" y="182" fill="#8A93A6" text-anchor="middle">Supabase</text>
    <rect x="218" y="170" width="62" height="18" rx="9" fill="none" stroke="#232936"/>
    <text x="249" y="182" fill="#8A93A6" text-anchor="middle">React 19</text>
    <rect x="286" y="170" width="48" height="18" rx="9" fill="none" stroke="#232936"/>
    <text x="310" y="182" fill="#8A93A6" text-anchor="middle">ONNX</text>
  </g>
  <path d="M300 96 Q345 56 396 84" fill="none" stroke="#D7FF3F" stroke-width="1" opacity="0.4"/>
  <circle r="2" fill="#D7FF3F">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M300 96 Q345 56 396 84"/>
  </circle>
  <g fill="#232936">
    <circle cx="306" cy="98" r="1.5"/><circle cx="330" cy="88" r="1.5"/><circle cx="352" cy="94" r="1.5"/>
    <circle cx="374" cy="86" r="1.5"/><circle cx="394" cy="90" r="1.5"/>
